<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="breach.os: a capture-the-flag puzzle game set on an abandoned school lab computer."
    />
    <title>breach.os</title>
    <!-- Link previews (Messenger, Facebook, LinkedIn). Add og:image once the site has its final address. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="breach.os" />
    <meta
      property="og:description"
      content="Recover ten flags from a wiped school lab computer and find out what happened."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; the fallbacks in tokens.css show until they arrive. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Sora:wght@400;600;700&family=Courier+Prime&family=Caveat:wght@500&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Sora:wght@400;600;700&family=Courier+Prime&family=Caveat:wght@500&display=swap"
    /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
